services:
  admin-portal:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: nhfinance_admin_portal
    ports:
      - "8090:8090"
    volumes:
      - ./frontend:/frontend
      - ./backend/app:/app/app
    environment:
      - PORTAL_HOST=0.0.0.0
      - PORTAL_PORT=8090
      - ACCESS_TOKEN_EXPIRE_MINUTES=43200
      - AIRFLOW_ADMIN_USERNAME=nhfinanceadmin
      - AIRFLOW_ADMIN_PASSWORD=nhathuy123
      - AIRFLOW_URL=http://sys02_airflow_webserver:8080
      - AIRFLOW_API_URL=http://sys02_airflow_webserver:8080/api/v1
      - CLICKHOUSE_HOST=clickhouse_server
      - CLICKHOUSE_PORT=8123
      - CLICKHOUSE_USER=nhfinanceadmin
      - CLICKHOUSE_PASSWORD=nhathuy123
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=nhfinanceadmin
      - MINIO_SECRET_KEY=nhathuy123
      - WSIS_HOST=wsis_websocket_collector
      - WSIS_PORT=8005
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - sys-02_default
      - sys-05_default
      - wsis_default

networks:
  sys-02_default:
    external: true
  sys-05_default:
    external: true
  wsis_default:
    external: true

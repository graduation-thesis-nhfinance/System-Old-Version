x-airflow-common:
  &airflow-common
  image: ${AIRFLOW_IMAGE_NAME:-apache/airflow:2.8.1-python3.10}
  environment:
    &airflow-common-env
    PYTHONPATH: /opt/airflow/src
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${POSTGRES_USER:-airflow}:${POSTGRES_PASSWORD:-airflow_secret}@airflow_postgres:5432/${POSTGRES_DB:-airflow_db}
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: 10
    MINIO_ENDPOINT: ${MINIO_ENDPOINT:-host.docker.internal:9000}
    MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-admin123}
    MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-admin123}
    CLICKHOUSE_HOST: ${CLICKHOUSE_HOST:-host.docker.internal}
    CLICKHOUSE_PORT: ${CLICKHOUSE_PORT:-8123}
    CLICKHOUSE_USER: ${CLICKHOUSE_USER:-admin123}
    CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-admin123}
  extra_hosts:
    - "host.docker.internal:host-gateway"

  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./logs:/opt/airflow/logs
    - ./plugins:/opt/airflow/plugins
  user: "${AIRFLOW_UID:-50000}:0"

services:
  # Isolated Metadata Postgres Database (Host Port 5433 -> Container Port 5432)
  airflow_postgres:
    image: postgres:15-alpine
    container_name: sys02_airflow_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-airflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airflow_secret}
      POSTGRES_DB: ${POSTGRES_DB:-airflow_db}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-airflow}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Airflow Init Service (DB Migration & Admin User Creation: admin123 / admin123)
  airflow_init:
    <<: *airflow-common
    container_name: sys02_airflow_init
    depends_on:
      airflow_postgres:
        condition: service_healthy
    entrypoint: >
      /bin/bash -c "airflow db migrate && airflow users create --username admin123 --firstname Data --lastname Admin --role Admin --email admin@company.com --password admin123 || true"

  # Airflow Webserver (Host Port 8080)
  airflow_webserver:
    <<: *airflow-common
    command: webserver
    container_name: sys02_airflow_webserver
    depends_on:
      airflow_postgres:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8085}:8080"

    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    restart: always

  # Airflow Scheduler
  airflow_scheduler:
    <<: *airflow-common
    command: scheduler
    container_name: sys02_airflow_scheduler
    depends_on:
      airflow_postgres:
        condition: service_healthy
      airflow_init:
        condition: service_completed_successfully
    restart: always





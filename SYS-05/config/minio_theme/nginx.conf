events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    server {
        listen 9091;
        server_name localhost;

        # Static assets for theme & branding
        location /custom-theme/custom_minio_theme.css {
            alias /etc/nginx/theme/custom_minio_theme.css;
            add_header Content-Type text/css;
        }

        location /custom-theme/theme_inject.js {
            alias /etc/nginx/theme/js/theme_inject.js;
            add_header Content-Type application/javascript;
        }

        # Proxy to MinIO Native Console (9001) with theme injection
        location / {
            proxy_pass http://minio_s3:9001;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support for MinIO live console telemetry
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # Chèn file CSS và script JS của NHFinance vào trước thẻ đóng </body>
            sub_filter '</body>' '<link rel="stylesheet" href="/custom-theme/custom_minio_theme.css"><script src="/custom-theme/theme_inject.js"></script></body>';
            sub_filter_once on;
            proxy_set_header Accept-Encoding ""; # Bắt buộc tắt gzip từ upstream để sub_filter thay thế được
        }
    }
}
